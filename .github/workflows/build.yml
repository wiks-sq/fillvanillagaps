name: Build

on:
  push:
    branches: [main, "26.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      # Game tests are skipped here: they start a Minecraft server, which needs the EULA accepted.
      # To run them in CI, change this to: ./gradlew build runGameTest -PacceptMinecraftEula=true
      - run: ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: fillvanillagaps-jar
          path: build/libs/*.jar
          if-no-files-found: error
