plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "fillvanillagaps"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fillvanillagaps" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Game tests start a Minecraft server, which requires accepting the Minecraft EULA (https://aka.ms/MinecraftEULA).
// They only run when you opt in:  ./gradlew runGameTest -PacceptMinecraftEula=true
def acceptMinecraftEula = providers.gradleProperty("acceptMinecraftEula").map { it.toBoolean() }.getOrElse(false)

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "fillvanillagaps-test"
		eula = acceptMinecraftEula
	}
}

tasks.named("runGameTest") {
	onlyIf("pass -PacceptMinecraftEula=true to run the game tests") { acceptMinecraftEula }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "LICENSE_fillvanillagaps" }
	}
}
